# Ngưỡng của pipeline. KHÔNG hardcode trong code.
# Hai loại giá trị:
#   - VẬN HÀNH (budget, queue, audit): do người dùng/thiết kế đặt, không cần hiệu chuẩn.
#   - HIỆU CHUẨN (gate.min_severity, retrain.*): phải do feedback/eval/calibrate.py sinh ra từ gold.
#     null = chưa hiệu chuẩn → giao diện gắn nhãn "chưa hiệu chuẩn", khuyến nghị retrain tắt.

version: 0                      # tăng mỗi lần hiệu chuẩn ghi lại file này

budget:
  per_run_usd: 2.0              # người dùng chốt 2026-09-24

queue:
  max_attempts: 3               # số lần một message được xử lý lại khi lỗi tạm thời
  backoff_sec: [5, 20, 60]

deepseek:
  retry_on_hard_violation: 1    # gọi lại khi output sai hình thức (Lớp 0), rồi mới coi là invalid

audit:
  rate: 0.05                    # tỉ lệ case mỗi run đưa vào hàng chờ gán nhãn tay, lấy ở mọi nhánh

gate:
  min_severity: null            # HIỆU CHUẨN — severity tối thiểu để deepseek_better thành lỗi đã xác nhận

retrain:                        # HIỆU CHUẨN — xem BUILD_PIPELINE.md §7.3
  min_kappa: 0.6                # chuẩn tối thiểu của judge (BUILD.md bước 8)
  max_false_alarm: null
  max_flip_rate: null
  min_cases: null
  max_error_rate: null
